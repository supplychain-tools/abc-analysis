<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,400;0,600;0,700;1,600&family=Chivo+Mono:wght@400;600;700&display=block">
<style>
  /* The social preview, sharing every measurement with the ordering
     calculator's card: the same sheet inset into the same ground, the same
     family line, the same 62px name, the same 30px sentence under it, and the
     picture taking whatever is left. The two sites are one family, and a feed
     is where that is either obvious or not at all.

     The card names the tool and draws what it draws. It prints no result. An
     unexplained 74,8 tells a reader scrolling past nothing at all, and the
     figures a reader does want are on the other side of the click; what the
     picture has to say — that a handful of lines carry the value and the tail
     carries almost none — it says by being a Pareto.

     Read at about 550 wide in a desktop feed and 350 on a phone, so nothing is
     under 26px, there are no hairlines under 2px, and the chart is drawn at
     weights that survive being halved.

     Designed against what the network prints around it. LinkedIn puts the
     image at the full width of the post and, on a grey strip beneath it, the
     og:title in bold and the domain in small grey. The og:description is not
     shown in the feed. So the address is not repeated here, and the picture
     carries the meaning on its own.

     The bars are the tool's worked example, the cafe's year of supplies the
     live page loads from "Charger l'exemple", so the card and the page it
     links to draw the same chart. */
  :root {
    --ground: #f4f6f8; --surface: #ffffff; --line: #d9e0e8; --line-strong: #7a8899;
    --text: #172033; --text-2: #5b6779; --accent: #2563eb;
    --rank-1: #2563eb; --rank-2: #85a9f3; --rank-3: #7a8899;
    --threshold: #f5b700; --trace: #1e3a5f;
    --mono: 'Chivo Mono', monospace; --sans: 'Fira Sans', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px; height: 630px; background: var(--ground);
    font-family: var(--sans); color: var(--text);
  }
  .sheet {
    position: absolute; inset: 34px; background: var(--surface); border-radius: 16px;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .head { padding: 38px 56px 0; flex: none; }
  .family { font-size: 26px; font-weight: 600; color: var(--accent); }
  /* 24ch rather than the sibling's 20ch. Its name is five words and wants the
     break; this one is four and fits on a line, and forcing "Analyse ABC des"
     over "stocks" breaks the name where nobody says it. */
  h1 {
    font-size: 62px; font-weight: 700; letter-spacing: -0.024em; line-height: 1.02;
    margin-top: 14px; max-width: 24ch;
  }
  .sub { font-size: 30px; line-height: 1.25; color: var(--text-2); margin-top: 16px; }

  /* The picture gets the rest, and a floor under it: a Pareto starved of
     height flattens into a row of stubs and a curve with nowhere to climb. */
  .plot { flex: 1; min-height: 250px; padding: 18px 56px 34px; }
  svg { width: 100%; height: 100%; display: block; }
  .axis { font-size: 26px; font-weight: 600; fill: var(--text-2); }
  .edge {
    font-size: 26px; font-weight: 700; fill: var(--text);
    paint-order: stroke; stroke: var(--surface); stroke-width: 9px; stroke-linejoin: round;
  }
  /* The band letters in the figure face, as the sibling sets Q* in it: a
     letter naming a class is a label on the data, not prose about it. */
  .band { font-family: var(--mono); font-size: 32px; font-weight: 700; fill: var(--text); }
</style>
</head>
<body>
  <div class="sheet">
    <div class="head">
      <div class="family">Supply Chain Tools</div>
      <h1>Analyse ABC des stocks</h1>
      <p class="sub">Quels articles portent l&rsquo;essentiel de la valeur du stock.</p>
    </div>
    <div class="plot"><svg id="chart"></svg></div>
  </div>

<script>
  /* The cafe's twenty-five lines, as units per year and the cost of one, with
     the classification computed here rather than drawn by hand. The chart is
     therefore the chart the tool produces from the same input, cuts included,
     and cannot drift from the page it advertises. */
  const SAMPLE = [
    [2400, 78], [180000, 0.62], [16000, 7.2], [5200, 14.5], [180000, 0.21],
    [34000, 0.54], [110, 132], [240, 42], [140, 68], [480, 18],
    [48, 168], [165, 42], [34000, 0.19], [70, 92], [11000, 0.48],
    [190, 28], [120, 44], [3, 1450], [36, 96], [2200, 1.35],
    [150, 19], [9000, 0.28], [260, 9.5], [6, 340], [24, 78],
  ];

  const values = SAMPLE.map(([usage, cost]) => usage * cost).sort((a, b) => b - a);
  const totalValue = values.reduce((a, b) => a + b, 0);

  let running = 0;
  const cumulative = values.map((v) => { running += v; return (running / totalValue) * 100; });

  const A_CUT = 80, B_CUT = 95;
  const bandOf = (i) => (cumulative[i] <= A_CUT ? 'A' : cumulative[i] <= B_CUT ? 'B' : 'C');
  const FILL = { A: 'var(--rank-1)', B: 'var(--rank-2)', C: 'var(--rank-3)' };

  /* The viewBox is measured from the box the drawing lands in rather than
     written down. The sibling writes its own down and scales it with
     preserveAspectRatio="none", which it can afford because its drawing is
     curves; here the drawing is twenty-five bars, and stretching one axis
     against the other leaves the bars one width and the gaps between them
     another. Measured, nothing is scaled: a 26px label is 26px on the sheet.

     R leaves room for the cuts' own figures and the curve's name, all set
     outside the plot; B for the band letters under the baseline. */
  const box = document.querySelector('.plot');
  const W = box.clientWidth, HT = box.clientHeight;
  document.getElementById('chart').setAttribute('viewBox', '0 0 ' + W + ' ' + HT);
  const L = 34, R = W - 168, T = 52, B = HT - 48;

  const N = values.length;
  const bw = (R - L) / N;
  /* The tallest bar stops short of the top. Run to the ceiling and it reads as
     a bar that has been cut off rather than the largest one there is. */
  const headroom = values[0] * 1.09;
  const yBar = (v) => B - (v / headroom) * (B - T);
  const yCum = (pct) => B - (pct / 100) * (B - T);

  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.getElementById('chart');
  const add = (tag, attrs, text) => {
    const el = document.createElementNS(ns, tag);
    for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
    if (text !== undefined) el.textContent = text;
    svg.appendChild(el);
    return el;
  };

  /* The baseline only, and neither axis named. The sibling names both because
     a cost curve against an order quantity is two continuous scales and says
     nothing until you know which is which; this is twenty-five bars falling
     from left to right under the letters A, B and C, which is a shape a reader
     has either seen before or is about to click to understand. The names sat
     where the chart needed the room and told that reader nothing.

     No vertical rule either: bars stand on the baseline and begin at the axis,
     so a rule there is hidden behind the first bar for its whole length except
     the stub above it, and that stub reads as a stray mark. */
  add('line', { x1: L, x2: R, y1: B, y2: B, stroke: 'var(--line-strong)', 'stroke-width': 2 });

  values.forEach((v, i) => {
    const x = L + i * bw;
    add('rect', { x: x + 2.5, y: yBar(v), width: bw - 5, height: B - yBar(v), fill: FILL[bandOf(i)] });
  });

  /* The two cuts that make the three classes, and the only amber on the card:
     a threshold is the one thing amber means anywhere in this family. Both are
     drawn alike because they are the same kind of thing — the reader is meant
     to see one rule applied twice, not a headline and a footnote. Each is
     named at the right, on the line it belongs to. */
  for (const cut of [A_CUT, B_CUT]) {
    add('line', {
      x1: L, x2: R, y1: yCum(cut), y2: yCum(cut),
      stroke: 'var(--threshold)', 'stroke-width': 4, 'stroke-dasharray': '11 8',
    });
    add('text', { x: R + 12, y: yCum(cut) + 9, class: 'edge' }, cut + ' %');
  }

  const cumPath = cumulative
    .map((pct, i) => (i === 0 ? 'M' : 'L') + (L + i * bw + bw / 2).toFixed(1) + ' ' + yCum(pct).toFixed(1))
    .join(' ');
  add('path', { d: cumPath, fill: 'none', stroke: 'var(--trace)', 'stroke-width': 5.5 });

  /* The curve named where it ends, the way the sibling names its three traces:
     at the line rather than in a legend to be looked up. Set above the curve's
     end rather than beside it, because the 95% cut arrives within a few pixels
     of 100% and its figure would otherwise be printed over this word. */
  add('text', { x: R + 12, y: T - 18, class: 'edge', fill: 'var(--trace)' }, 'cumul');

  /* Each band named under the run of bars it covers, in ink rather than in its
     own fill: --rank-2 measures 2.4:1 against white and cannot carry a letter.
     The bars hold the colour, the position holds the mapping. */
  const firstOf = (band) => values.findIndex((_, i) => bandOf(i) === band);
  const lastOf = (band) => values.reduce((acc, _, i) => (bandOf(i) === band ? i : acc), -1);
  for (const band of ['A', 'B', 'C']) {
    const from = firstOf(band), to = lastOf(band);
    if (from < 0) continue;
    const mid = L + ((from + to) / 2 + 0.5) * bw;
    add('text', { x: mid, y: B + 34, 'text-anchor': 'middle', class: 'band' }, band);
  }

  document.documentElement.dataset.drawn = 'true';
</script>
</body>
</html>
