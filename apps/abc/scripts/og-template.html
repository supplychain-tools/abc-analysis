<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,400;0,600;0,700;1,600&family=Chivo+Mono:wght@400;600;700&display=block">
<style>
  /* The social preview, built to the ordering calculator's card and sharing
     every measurement with it: the same bar across the top, the same split
     into a reading and a picture, the same type sizes. The two sites are one
     family, and a feed is where that is either obvious or not at all.

     It is the tool's own answer screen, cropped to the moment that screen
     exists for. A reader scrolling gets one glance; what they get here is what
     they would get after filling the table.

     Designed against what the network prints around it. LinkedIn puts the
     image at the full width of the post and, on a grey strip beneath it, the
     og:title in bold and the domain in small grey. The og:description is not
     shown in the feed. So the address is not repeated here, and the picture
     carries the meaning on its own.

     Read at about 550 wide in a desktop feed and 350 on a phone, so nothing is
     under 22px, there are no hairlines under 2px, and the chart is drawn at
     weights that survive being halved.

     The figures are the tool's worked example, the cafe's year of supplies the
     live page loads from "Charger l'exemple", so the card and the page it
     links to say the same thing. */
  :root {
    --ground: #f4f6f8; --surface: #ffffff; --surface-2: #f1f5f9;
    --line: #d9e0e8; --line-strong: #7a8899;
    --text: #172033; --text-2: #5b6779;
    --accent: #2563eb;
    --rank-1: #2563eb; --rank-2: #85a9f3; --rank-3: #7a8899;
    --threshold: #f5b700; --trace: #1e3a5f;
    --mono: 'Chivo Mono', monospace; --sans: 'Fira Sans', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px; height: 630px; background: var(--ground);
    font-family: var(--sans); color: var(--text);
    display: flex; flex-direction: column;
  }

  /* The shell, as the page wears it: the family, then the tool. */
  .bar {
    flex: none; background: var(--surface); border-bottom: 2px solid var(--line);
    padding: 22px 44px; display: flex; align-items: baseline; gap: 12px;
  }
  .family { font-size: 27px; font-weight: 600; color: var(--text-2); }
  .slash { font-size: 27px; font-weight: 600; color: var(--line-strong); }
  .tool { font-size: 30px; font-weight: 700; }

  .body { flex: 1; padding: 34px 44px 38px; display: flex; gap: 32px; min-height: 0; }
  .col { display: flex; flex-direction: column; min-width: 0; }
  .left { width: 540px; flex: none; }
  .right { flex: 1; background: var(--surface); border-radius: 10px; display: flex; flex-direction: column; }

  /* The finding, first, because in a feed the blue figures are what stop the
     scroll and a sentence above them is a wall to get past before anything is
     seen.

     Two figures rather than one, and set at one size, because the finding is a
     comparison and neither half of it means anything alone: a share of the
     value is a number, a share of the value against the share of the list that
     carries it is the reason the classification exists. The word between them
     is the pivot and stays small and grey. It binds; it is not read. */
  .finding { margin-top: 2px; }
  .line {
    display: flex; flex-wrap: nowrap; align-items: baseline; gap: 0.16em;
    font-family: var(--mono); font-weight: 700; font-size: 62px;
    line-height: 1.12; letter-spacing: -0.02em; font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .answer { color: var(--accent); }
  .op { font-family: var(--sans); font-size: 0.44em; font-weight: 400; color: var(--text-2); }
  .unit {
    font-family: var(--sans); font-size: 0.38em; font-weight: 600;
    color: var(--text-2); margin-left: 0.14em;
  }

  .lead { font-size: 27px; line-height: 1.3; color: var(--text-2); margin-top: 20px; }

  /* What the finding costs and returns in money, in the boxes the page puts
     its figures in. Deliberately not a percentage among them: both shares are
     spent above, and a card that prints 74,8 twice has said one thing and
     charged the reader for two. Class A against class C in currency is the
     same argument in the unit a reader buys in: four lines worth half a
     million, ten worth thirty thousand.

     Stacked rather than side by side: at half this width a two-column pair
     gives each label about nine characters, and both of them wrap. */
  .kpis { display: flex; flex-direction: column; gap: 12px; margin-top: auto; }
  .kpi {
    background: var(--surface-2); border-radius: 8px; padding: 17px 20px;
    display: flex; align-items: baseline; justify-content: space-between; gap: 20px;
  }
  .kpi .k { font-size: 25px; font-weight: 600; color: var(--text-2); }
  .kpi .v {
    font-family: var(--mono); font-size: 32px; font-weight: 700;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .kpi .v small {
    font-family: var(--sans); font-size: 20px; font-weight: 600;
    color: var(--text-2); margin-left: 0.3em;
  }

  /* The group separator inside a figure.

     A monospace gives every glyph one cell, a thin space included, so 489 400
     set plainly reads as two numbers with a gap between them. word-spacing is
     no use here, since it moves U+0020 and nothing else and this is U+2009, so
     the space is set in its own box and shrunk to about the width the
     proportional face would have given it. */
  .sep { font-size: 0.34em; }

  /* The picture gets the rest. It is the half of the card that says something
     the figures do not: that the drop is a cliff, and that the tail runs on
     for twenty lines worth almost nothing. */
  .plot-head { font-size: 24px; font-weight: 600; color: var(--text-2); padding: 16px 20px 0; }
  .plot { flex: 1; min-height: 0; padding: 6px 20px 16px; }
  svg { width: 100%; height: 100%; display: block; }
  .axis { font-size: 22px; font-weight: 600; fill: var(--text-2); }
  .band { font-family: var(--mono); font-size: 27px; font-weight: 700; fill: var(--text); }
  .cut {
    font-size: 22px; font-weight: 700; fill: var(--text);
    paint-order: stroke; stroke: var(--surface); stroke-width: 7px; stroke-linejoin: round;
  }
</style>
</head>
<body>
  <div class="bar">
    <span class="family">Supply Chain Tools</span>
    <span class="slash">/</span>
    <span class="tool">Analyse ABC des stocks</span>
  </div>

  <div class="body">
    <div class="col left">
      <div class="finding">
        <div class="line">
          <span class="answer">74,8</span>
          <span class="unit">% de la valeur</span>
        </div>
        <div class="line">
          <span class="op">sur</span>
          <span class="answer">16,0</span>
          <span class="unit">% des articles</span>
        </div>
      </div>

      <p class="lead">Les quelques articles qui portent l&rsquo;essentiel de la valeur du stock.</p>

      <div class="kpis">
        <div class="kpi">
          <div class="k">Articles en classe A</div>
          <div class="v">4 <small>sur 25</small></div>
        </div>
        <div class="kpi">
          <div class="k">Valeur de la classe A</div>
          <div class="v">489<span class="sep">&thinsp;</span>400,00 <small>MAD</small></div>
        </div>
        <div class="kpi">
          <div class="k">Valeur de la classe C</div>
          <div class="v">33<span class="sep">&thinsp;</span>088,00 <small>MAD</small></div>
        </div>
      </div>
    </div>

    <div class="col right">
      <div class="plot-head">Valeur annuelle par article</div>
      <div class="plot"><svg id="chart" viewBox="0 0 500 352" preserveAspectRatio="none"></svg></div>
    </div>
  </div>

<script>
  /* The cafe's twenty-five lines, as units per year and the cost of one, with
     the classification computed here rather than drawn by hand. The chart is
     therefore the chart the tool produces from the same input, cuts included,
     and cannot drift from the page it advertises. */
  const SAMPLE = [
    [2400, 78], [180000, 0.62], [16000, 7.2], [5200, 14.5], [180000, 0.21],
    [34000, 0.54], [110, 132], [240, 42], [140, 68], [480, 18],
    [48, 168], [165, 42], [34000, 0.19], [70, 92], [11000, 0.48],
    [190, 28], [120, 44], [3, 1450], [36, 96], [2200, 1.35],
    [150, 19], [9000, 0.28], [260, 9.5], [6, 340], [24, 78],
  ];

  const values = SAMPLE.map(([usage, cost]) => usage * cost).sort((a, b) => b - a);
  const totalValue = values.reduce((a, b) => a + b, 0);

  let running = 0;
  const cumulative = values.map((v) => { running += v; return (running / totalValue) * 100; });

  const A_CUT = 80, B_CUT = 95;
  const bandOf = (i) => (cumulative[i] <= A_CUT ? 'A' : cumulative[i] <= B_CUT ? 'B' : 'C');
  const FILL = { A: 'var(--rank-1)', B: 'var(--rank-2)', C: 'var(--rank-3)' };

  /* preserveAspectRatio="none" scales x and y independently, so the viewBox is
     sized to the box it is painted into rather than to a round number: a
     mismatch squashes every label in the drawing. R leaves room for the cut's
     own figure, which is set outside the plot. */
  const W = 500, HT = 352, L = 24, R = W - 78, T = 30, B = HT - 42;
  const N = values.length;
  const bw = (R - L) / N;
  /* The tallest bar stops short of the top. Run to the ceiling it reads as a
     bar that has been cut off rather than the largest one there is. */
  const headroom = values[0] * 1.09;
  const yBar = (v) => B - (v / headroom) * (B - T);
  const yCum = (pct) => B - (pct / 100) * (B - T);

  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.getElementById('chart');
  const add = (tag, attrs, text) => {
    const el = document.createElementNS(ns, tag);
    for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
    if (text !== undefined) el.textContent = text;
    svg.appendChild(el);
    return el;
  };

  /* The baseline only. The sibling draws both axes because its curves start
     away from the left edge and need one to be measured against; bars stand on
     the baseline and begin at the axis, so a vertical rule there is hidden
     behind the first bar for its whole length except the stub above it, and
     that stub reads as a stray mark rather than as an axis. */
  add('line', { x1: L, x2: R, y1: B, y2: B, stroke: 'var(--line-strong)', 'stroke-width': 2 });

  values.forEach((v, i) => {
    const x = L + i * bw;
    add('rect', { x: x + 1.2, y: yBar(v), width: bw - 2.4, height: B - yBar(v), fill: FILL[bandOf(i)] });
  });

  /* The 80% cut, which is what makes the A class, and the only amber on the
     card: a threshold is the one thing amber means anywhere in this family. */
  add('line', {
    x1: L, x2: R, y1: yCum(A_CUT), y2: yCum(A_CUT),
    stroke: 'var(--threshold)', 'stroke-width': 3.5, 'stroke-dasharray': '9 7',
  });
  add('text', { x: R + 8, y: yCum(A_CUT) + 8, class: 'cut' }, '80 %');

  const cumPath = cumulative
    .map((pct, i) => (i === 0 ? 'M' : 'L') + (L + i * bw + bw / 2).toFixed(1) + ' ' + yCum(pct).toFixed(1))
    .join(' ');
  add('path', { d: cumPath, fill: 'none', stroke: 'var(--trace)', 'stroke-width': 5 });

  /* Each band named under the run of bars it covers, in ink rather than in its
     own fill: --rank-2 measures 2.4:1 against white and cannot carry a letter.
     The bars hold the colour, the position holds the mapping. */
  const firstOf = (band) => values.findIndex((_, i) => bandOf(i) === band);
  const lastOf = (band) => values.reduce((acc, _, i) => (bandOf(i) === band ? i : acc), -1);
  for (const band of ['A', 'B', 'C']) {
    const from = firstOf(band), to = lastOf(band);
    if (from < 0) continue;
    const mid = L + ((from + to) / 2 + 0.5) * bw;
    add('text', { x: mid, y: B + 30, 'text-anchor': 'middle', class: 'band' }, band);
  }

  /* The curve named where it ends, the way the sibling names its three traces:
     at the line rather than in a legend to be looked up. It also fills the one
     empty corner a Pareto leaves, which is the corner the curve is heading
     for. */
  add('text', { x: R + 8, y: yCum(100) + 7, class: 'cut', fill: 'var(--trace)' }, 'cumul');

  document.documentElement.dataset.drawn = 'true';
</script>
</body>
</html>
