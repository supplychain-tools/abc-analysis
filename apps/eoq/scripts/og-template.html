<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,400;0,600;0,700;1,600&family=Chivo+Mono:wght@400;600;700&display=block">
<style>
  :root {
    --ground: #d9d6ce; --surface: #fbfaf6; --line: #c6c1b5; --line-strong: #8a8578;
    --text: #23211c; --text-2: #5e594e; --accent: #23211c; --mark: #f2c302; --signal: #a62a17;
    --mono: 'Chivo Mono', monospace; --sans: 'Fira Sans', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; background: var(--ground); font-family: var(--sans); color: var(--text); }
  .sheet { position: absolute; inset: 40px; background: var(--surface); display: flex; flex-direction: column; }
  .head { padding: 26px 44px 0; }
  .eyebrow { font-size: 19px; font-weight: 600; color: var(--text-2); }
  h1 { font-family: var(--mono); font-size: 58px; font-weight: 700; letter-spacing: -0.02em;
       line-height: 1; margin-top: 16px; display: flex; align-items: center; gap: 16px; }
  h1 .sym { font-family: var(--sans); font-style: italic; font-weight: 600; }
  h1 .op { font-weight: 400; color: var(--text-2); }
  h1 .star { font-style: normal; font-size: 0.52em; vertical-align: 0.62em; }
  .band { position: relative; padding: 0 0.14em; white-space: nowrap; }
  .band::before { content: ''; position: absolute; inset: 0.1em -0.04em 0.04em; background: var(--mark); }
  .band span { position: relative; }
  .sub { font-size: 22px; color: var(--text-2); margin-top: 10px; }
  .plot { flex: 1; min-height: 0; padding: 4px 44px 10px; }
  svg { width: 100%; height: 100%; display: block; }
  .tick { font-family: var(--mono); font-size: 15px; fill: var(--text-2); }
  .mark { font-family: var(--mono); font-size: 21px; font-weight: 700; fill: var(--text);
          paint-order: stroke; stroke: var(--surface); stroke-width: 6px; stroke-linejoin: round; }
  .trace-label { font-family: var(--mono); font-size: 16px; fill: var(--text-2); }
  .foot { display: flex; gap: 44px; padding: 0 44px 26px; align-items: baseline; flex: none; }
  .foot .k { font-size: 16px; font-weight: 600; color: var(--text-2); }
  .foot .v { font-family: var(--mono); font-size: 30px; font-weight: 700; margin-top: 4px; }
  .foot .v.q { color: var(--text); }
</style>
</head>
<body>
  <div class="sheet">
    <div class="head">
      <div class="eyebrow">Quantité économique de commande</div>
      <h1>
        <span class="sym">Q<span class="star">*</span></span>
        <span class="op">=</span>
        <span class="band"><span id="qhero"></span></span>
      </h1>
      <p class="sub">Le coût de passation et le coût de possession s’égalisent en Q*.</p>
    </div>
    <div class="plot"><svg id="chart" viewBox="0 0 1080 250" preserveAspectRatio="none"></svg></div>
    <div class="foot">
      <div><div class="k">Commandes par an</div><div class="v" id="n"></div></div>
      <div><div class="k">Coût total pertinent</div><div class="v" id="c"></div></div>
    </div>
  </div>

<script>
  const D = 24000, S = 450, H = 8.47;
  const qStar = Math.sqrt((2 * D * S) / H);
  const ordering = (q) => (D / q) * S;
  const holding = (q) => (q / 2) * H;
  const total = (q) => ordering(q) + holding(q);

  /* Domain chosen around Q*, not from zero: the interesting part of the curve
     is its flat bottom, and starting at zero spends most of the width on an
     asymptote nobody orders at. */
  const qMin = qStar / 3, qMax = qStar * 2.2;
  const yMax = Math.max(total(qMin), total(qMax)) * 1.06;

  const W = 1080, HT = 250, L = 8, R = W - 108, T = 26, B = HT - 30;
  const sx = (q) => L + ((q - qMin) / (qMax - qMin)) * (R - L);
  const sy = (v) => B - (v / yMax) * (B - T);
  const path = (f) => {
    let d = '';
    for (let i = 0; i <= 240; i += 1) {
      const q = qMin + (i / 240) * (qMax - qMin);
      d += (d ? ' L' : 'M') + sx(q).toFixed(1) + ' ' + sy(f(q)).toFixed(1);
    }
    return d;
  };

  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.getElementById('chart');
  const add = (tag, attrs, text) => {
    const el = document.createElementNS(ns, tag);
    for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
    if (text !== undefined) el.textContent = text;
    svg.appendChild(el);
    return el;
  };

  add('line', { x1: L, x2: R, y1: B, y2: B, stroke: 'var(--line-strong)', 'stroke-width': 1.5 });
  add('path', { d: path(ordering), fill: 'none', stroke: 'var(--text-2)', 'stroke-width': 2.5, 'stroke-dasharray': '7 6' });
  add('path', { d: path(holding), fill: 'none', stroke: 'var(--text-2)', 'stroke-width': 2.5 });
  add('path', { d: path(total), fill: 'none', stroke: 'var(--text)', 'stroke-width': 4 });

  add('text', { x: R + 8, y: sy(ordering(qMax)) + 6, class: 'trace-label' }, 'passation');
  add('text', { x: R + 8, y: sy(holding(qMax)) + 6, class: 'trace-label' }, 'possession');

  const yStar = sy(total(qStar));
  add('line', { x1: sx(qStar), x2: sx(qStar), y1: yStar, y2: B, stroke: 'var(--mark)', 'stroke-width': 4 });
  add('circle', { cx: sx(qStar), cy: yStar, r: 8, fill: 'var(--mark)', stroke: 'var(--text)', 'stroke-width': 2 });
  add('circle', { cx: sx(qStar), cy: sy(holding(qStar)), r: 6, fill: 'var(--mark)', stroke: 'var(--text)', 'stroke-width': 2 });
  add('text', { x: sx(qStar), y: yStar - 18, 'text-anchor': 'middle', class: 'mark' }, 'Q*');

  const fr = (v, d) => v.toLocaleString('fr-FR', { minimumFractionDigits: d, maximumFractionDigits: d });
  document.getElementById('qhero').textContent = fr(qStar, 1) + ' unités';
  document.getElementById('n').textContent = fr(D / qStar, 1);
  document.getElementById('c').textContent = fr(total(qStar), 2) + ' MAD';
  document.documentElement.dataset.drawn = 'true';
</script>
</body>
</html>
