<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;600;700&family=Chivo+Mono:wght@400;700&display=block">
<style>
  /* The social preview.

     Designed against what the network actually prints around it. LinkedIn
     puts the image at the full width of the post and, underneath it on a grey
     strip, the og:title in bold and the domain in small grey. The
     og:description is not shown in the feed.

     Two consequences, and they are why this card looks the way it does. The
     address is not repeated here, because LinkedIn prints it a few pixels
     below; a card that repeats it spends a line saying what the reader is
     already being told. And the picture has to carry the meaning on its own,
     because the sentence explaining it may never be displayed.

     Read at about 550 wide in a desktop feed and 350 on a phone, so nothing
     is under 26px, there are no hairlines, and the chart is drawn at weights
     that survive being halved. */
  :root {
    --ground: #f4f6f8; --surface: #ffffff; --line: #d9e0e8; --line-strong: #7a8899;
    --text: #172033; --text-2: #5b6779; --accent: #2563eb;
    --trace: #1e3a5f;
    --mono: 'Chivo Mono', monospace; --sans: 'Fira Sans', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px; height: 630px; background: var(--ground);
    font-family: var(--sans); color: var(--text);
  }
  .sheet {
    position: absolute; inset: 34px; background: var(--surface); border-radius: 16px;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .head { padding: 38px 56px 0; flex: none; }
  .family { font-size: 26px; font-weight: 600; color: var(--accent); }
  h1 {
    font-size: 62px; font-weight: 700; letter-spacing: -0.024em; line-height: 1.02;
    margin-top: 14px; max-width: 20ch;
  }
  .sub { font-size: 30px; line-height: 1.25; color: var(--text-2); margin-top: 16px; }
  /* The picture gets the room. It is the half of the card that says something
     the title does not, and a starved curve flattens into parallel lines. */
  .plot { flex: 1; min-height: 250px; padding: 18px 56px 34px; }
  svg { width: 100%; height: 100%; display: block; }
  .axis { font-size: 26px; font-weight: 600; fill: var(--text-2); }
  .trace-label { font-size: 26px; font-weight: 700; }
  .mark {
    font-family: var(--mono); font-size: 32px; font-weight: 700; fill: var(--accent);
    paint-order: stroke; stroke: var(--surface); stroke-width: 9px; stroke-linejoin: round;
  }
</style>
</head>
<body>
  <div class="sheet">
    <div class="head">
      <div class="family">Supply Chain Tools</div>
      <h1>Quantité économique de commande</h1>
      <p class="sub">Combien commander à la fois pour que le coût annuel soit le plus bas.</p>
    </div>
    <div class="plot"><svg id="chart" viewBox="0 0 1088 248" preserveAspectRatio="none"></svg></div>
  </div>

<script>
  /* The curve is drawn from the model rather than sketched, so the minimum is
     where the arithmetic puts it. The figures behind it are never printed:
     an unexplained 1 596,9 tells a reader scrolling past nothing at all. */
  const D = 24000, S = 450, H = 8.47;
  const qStar = Math.sqrt((2 * D * S) / H);
  const ordering = (q) => (D / q) * S;
  const holding = (q) => (q / 2) * H;
  const total = (q) => ordering(q) + holding(q);

  /* Domain chosen around Q*, not from zero: the interesting part of the curve
     is its flat bottom, and starting at zero spends most of the width on an
     asymptote nobody orders at. */
  const qMin = qStar / 3, qMax = qStar * 2.15;
  const yMax = Math.max(total(qMin), total(qMax)) * 1.04;

  const W = 1088, HT = 248, L = 34, R = W - 168, T = 52, B = HT - 40;
  const sx = (q) => L + ((q - qMin) / (qMax - qMin)) * (R - L);
  const sy = (v) => B - (v / yMax) * (B - T);
  const path = (f) => {
    let d = '';
    for (let i = 0; i <= 240; i += 1) {
      const q = qMin + (i / 240) * (qMax - qMin);
      d += (d ? ' L' : 'M') + sx(q).toFixed(1) + ' ' + sy(f(q)).toFixed(1);
    }
    return d;
  };

  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.getElementById('chart');
  const add = (tag, attrs, text) => {
    const el = document.createElementNS(ns, tag);
    for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
    if (text !== undefined) el.textContent = text;
    svg.appendChild(el);
    return el;
  };

  /* The two axes, named in words. A reader who never clicks should still come
     away knowing what is plotted against what. */
  add('line', { x1: L, x2: R, y1: B, y2: B, stroke: 'var(--line-strong)', 'stroke-width': 2.5 });
  add('line', { x1: L, x2: L, y1: T - 6, y2: B, stroke: 'var(--line-strong)', 'stroke-width': 2.5 });
  /* Named above the axis on one line rather than beside it: two stacked words
     in a left margin collide with the curve where it is steepest. */
  add('text', { x: L, y: T - 18, class: 'axis' }, 'coût annuel');
  add('text', { x: R, y: B + 32, 'text-anchor': 'end', class: 'axis' }, 'quantité commandée');

  add('path', { d: path(ordering), fill: 'none', stroke: 'var(--text-2)', 'stroke-width': 3.5, 'stroke-dasharray': '11 9' });
  add('path', { d: path(holding), fill: 'none', stroke: 'var(--text-2)', 'stroke-width': 3.5 });
  add('path', { d: path(total), fill: 'none', stroke: 'var(--trace)', 'stroke-width': 7 });

  add('text', { x: R + 12, y: sy(ordering(qMax)) + 8, class: 'trace-label', fill: 'var(--text-2)' }, 'passation');
  add('text', { x: R + 12, y: sy(holding(qMax)) + 8, class: 'trace-label', fill: 'var(--text-2)' }, 'possession');
  add('text', { x: R + 12, y: sy(total(qMax)) - 14, class: 'trace-label', fill: 'var(--trace)' }, 'total');

  const yStar = sy(total(qStar));
  add('line', { x1: sx(qStar), x2: sx(qStar), y1: yStar, y2: B, stroke: 'var(--accent)', 'stroke-width': 5 });
  add('circle', { cx: sx(qStar), cy: yStar, r: 12, fill: 'var(--accent)', stroke: 'var(--surface)', 'stroke-width': 4 });
  add('text', { x: sx(qStar) + 18, y: yStar - 16, class: 'mark' }, 'Q*');

  document.documentElement.dataset.drawn = 'true';
</script>
</body>
</html>
