<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;600;700&family=Chivo+Mono:wght@400;700&display=block">
<style>
  /* The social preview.

     Sized 1200 by 630 and read at about 550 wide in a LinkedIn feed, and
     smaller than that on a phone. Everything here is scaled for that
     reduction rather than for the file: nothing under 26px, no hairlines, no
     axis ticks. A chart drawn at the weights the site uses turns to grey fuzz
     at less than half size.

     It carries no worked figures. An unexplained 1 596,9 tells a reader
     scrolling past nothing at all; what the tool is, and the shape of the
     answer it finds, tell them whether to stop. */
  :root {
    --ground: #f4f6f8; --surface: #ffffff; --line: #d9e0e8; --line-strong: #7a8899;
    --text: #172033; --text-2: #5b6779; --accent: #2563eb; --mark: #2563eb;
    --trace: #1e3a5f;
    --mono: 'Chivo Mono', monospace; --sans: 'Fira Sans', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px; height: 630px; background: var(--ground);
    font-family: var(--sans); color: var(--text);
  }
  .sheet {
    position: absolute; inset: 36px; background: var(--surface); border-radius: 14px;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .head { padding: 34px 52px 0; flex: none; }
  .family { font-size: 26px; font-weight: 600; color: var(--accent); letter-spacing: 0.01em; }
  h1 {
    font-size: 58px; font-weight: 700; letter-spacing: -0.022em; line-height: 1.03;
    margin-top: 14px; max-width: 22ch;
  }
  .sub { font-size: 28px; line-height: 1.3; color: var(--text-2); margin-top: 12px; max-width: 46ch; }
  /* The curve has to keep its U. Starved of height it flattens into three
     parallel lines and stops saying anything at all. */
  .plot { flex: 1; min-height: 220px; padding: 14px 52px 4px; }
  svg { width: 100%; height: 100%; display: block; }
  .trace-label { font-family: var(--sans); font-size: 24px; font-weight: 600; fill: var(--text-2); }
  .mark {
    font-family: var(--mono); font-size: 30px; font-weight: 700; fill: var(--text);
    paint-order: stroke; stroke: var(--surface); stroke-width: 8px; stroke-linejoin: round;
  }
  .foot {
    display: flex; justify-content: space-between; align-items: baseline;
    margin: 0 52px; padding: 16px 0 28px; border-top: 2px solid var(--line); flex: none;
  }
  .foot .where { font-family: var(--mono); font-size: 26px; color: var(--text); }
  .foot .langs { font-size: 26px; font-weight: 600; color: var(--text-2); }
</style>
</head>
<body>
  <div class="sheet">
    <div class="head">
      <div class="family">Supply Chain Tools</div>
      <h1>Quantité économique de commande</h1>
      <p class="sub">Combien commander à la fois, et ce que coûte une commande hors optimum.</p>
    </div>

    <div class="plot"><svg id="chart" viewBox="0 0 1080 230" preserveAspectRatio="none"></svg></div>

    <div class="foot">
      <span class="where">supplychain-tools.github.io/eoq</span>
      <span class="langs">Français et anglais</span>
    </div>
  </div>

<script>
  /* The curve is drawn from the model rather than sketched, so the minimum is
     where the arithmetic puts it. The figures behind it are never printed. */
  const D = 24000, S = 450, H = 8.47;
  const qStar = Math.sqrt((2 * D * S) / H);
  const ordering = (q) => (D / q) * S;
  const holding = (q) => (q / 2) * H;
  const total = (q) => ordering(q) + holding(q);

  /* Domain chosen around Q*, not from zero: the interesting part of the curve
     is its flat bottom, and starting at zero spends most of the width on an
     asymptote nobody orders at. */
  const qMin = qStar / 3, qMax = qStar * 2.2;
  const yMax = Math.max(total(qMin), total(qMax)) * 1.06;

  const W = 1080, HT = 230, L = 8, R = W - 180, T = 34, B = HT - 12;
  const sx = (q) => L + ((q - qMin) / (qMax - qMin)) * (R - L);
  const sy = (v) => B - (v / yMax) * (B - T);
  const path = (f) => {
    let d = '';
    for (let i = 0; i <= 240; i += 1) {
      const q = qMin + (i / 240) * (qMax - qMin);
      d += (d ? ' L' : 'M') + sx(q).toFixed(1) + ' ' + sy(f(q)).toFixed(1);
    }
    return d;
  };

  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.getElementById('chart');
  const add = (tag, attrs, text) => {
    const el = document.createElementNS(ns, tag);
    for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
    if (text !== undefined) el.textContent = text;
    svg.appendChild(el);
    return el;
  };

  add('line', { x1: L, x2: R, y1: B, y2: B, stroke: 'var(--line-strong)', 'stroke-width': 2 });
  add('path', { d: path(ordering), fill: 'none', stroke: 'var(--text-2)', 'stroke-width': 3.5, 'stroke-dasharray': '10 8' });
  add('path', { d: path(holding), fill: 'none', stroke: 'var(--text-2)', 'stroke-width': 3.5 });
  add('path', { d: path(total), fill: 'none', stroke: 'var(--trace)', 'stroke-width': 6 });

  add('text', { x: R + 14, y: sy(ordering(qMax)) + 8, class: 'trace-label' }, 'passation');
  add('text', { x: R + 14, y: sy(holding(qMax)) + 8, class: 'trace-label' }, 'possession');

  const yStar = sy(total(qStar));
  add('line', { x1: sx(qStar), x2: sx(qStar), y1: yStar, y2: B, stroke: 'var(--mark)', 'stroke-width': 5 });
  add('circle', { cx: sx(qStar), cy: yStar, r: 11, fill: 'var(--mark)', stroke: 'var(--surface)', 'stroke-width': 3 });
  add('text', { x: sx(qStar), y: yStar - 22, 'text-anchor': 'middle', class: 'mark' }, 'Q*');

  document.documentElement.dataset.drawn = 'true';
</script>
</body>
</html>
